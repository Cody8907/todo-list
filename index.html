<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>My To-Do List</h1>
      <p class="subtitle">Stay organized, one task at a time.</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
        required
      />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state hidden">No tasks here. Add one above! 🎉</p>

    <footer id="footer" class="footer hidden">
      <span id="task-count">0 tasks left</span>
      <button id="clear-completed" class="btn-clear">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
